name: treasury-cash-forecast
label: Treasury Cash Forecast
kind: standalone
version: 0.1.0
author: Prabhusekaran Muthappan
license: MIT
homepage: https://github.com/Prabhusekaran/hermes-treasury-cash-forecast
description: >
  A 12-month monthly direct cash-flow forecast for corporate treasury. Fill a
  template (Excel or CSV) with your past cash-flow statement, known future
  payments and what-if percentages. Forecast lines are projected by a
  statistical model (ETS by default; SARIMA, four simple baselines, optional
  Chronos-2), known lines come from your schedule, and scenarios apply only
  when you pick one. The result is an Excel cash-flow statement, actuals then
  forecast, reconciled to the cent every month: opening cash + net cash flow =
  closing cash. The numbers come from a tested engine, not from the language
  model. No network calls, no credentials.
tags: [finance, treasury, forecasting]
requires_hermes: ">=0.22.2"
provides_tools:
  - cash_forecast_template
  - cash_forecast_validate
  - cash_forecast_run
  - cash_forecast_compare
provides_hooks: []
